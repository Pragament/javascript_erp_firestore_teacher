<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Papers</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5HCH2EN3HZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5HCH2EN3HZ');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css?v=2026.09.22.1">
</head>
<body style="background:#f8f9fa">
    <div class="report-page question-papers-page">
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                <div>
                    <h4 class="mb-1"><i class="bi bi-journal-text me-2"></i>Question Papers</h4>
                    <p id="question-papers-subtitle" class="text-muted mb-0">Loading question papers...</p>
                </div>
                <div class="d-flex flex-column flex-sm-row gap-2">
                    <button id="create-question-paper-btn" type="button" class="btn" style="background:#16a085;color:white;border:none" data-bs-toggle="modal" data-bs-target="#questionPaperImportModal">
                        <i class="bi bi-plus-lg me-1"></i>Create Question Paper
                    </button>
                    <button id="question-papers-refresh" type="button" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                    </button>
                    <a href="index.html" class="btn" style="background:#2c3e50;color:white;border:none">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                </div>
            </div>
            <div class="border-top px-3 py-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-8">
                        <label for="question-papers-search" class="form-label small text-muted mb-1">Search</label>
                        <input id="question-papers-search" class="form-control form-control-sm" type="search" placeholder="Name, ID, subject...">
                    </div>
                    <div class="col-md-4">
                        <label for="question-papers-sort" class="form-label small text-muted mb-1">Sort</label>
                        <select id="question-papers-sort" class="form-select form-select-sm">
                            <option value="name-asc">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="questions-desc">Questions (High-Low)</option>
                            <option value="questions-asc">Questions (Low-High)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="question-papers-content">
            <div class="text-center py-5">
                <div class="spinner-border" style="color:#2c3e50"></div>
                <p class="mt-2">Loading question papers...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="questionPaperImportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header text-white" style="background:#2c3e50;">
                    <h5 class="modal-title"><i class="bi bi-journal-plus me-2"></i>Create Question Paper From CSV</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label for="question-paper-import-name" class="form-label fw-semibold">Question Paper Name</label>
                            <input id="question-paper-import-name" class="form-control" type="text" placeholder="e.g., Class 6 Divisibility Rules">
                        </div>
                        <div class="col-md-4">
                            <label for="question-paper-import-file" class="form-label fw-semibold">CSV File</label>
                            <input id="question-paper-import-file" class="form-control" type="file" accept=".csv,text/csv">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="question-paper-import-csv" class="form-label fw-semibold">Paste CSV</label>
                        <textarea id="question-paper-import-csv" class="form-control font-monospace" rows="8" placeholder='"question","option1","option2","option3","option4","correct_option","subject","chapter","topic","subtopic","class","correct_answer_logic"'></textarea>
                    </div>
                    <div id="question-paper-import-message" class="small mb-3 text-muted">Paste CSV or choose a CSV file, then preview before saving.</div>
                    <div id="question-paper-import-preview" class="d-none">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-2">
                            <h6 class="fw-bold mb-0">Preview</h6>
                            <span id="question-paper-import-summary" class="badge" style="background:#16a085;color:white"></span>
                        </div>
                        <div class="table-responsive question-paper-import-preview-table">
                            <table class="table table-bordered table-sm align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Q.No</th>
                                        <th>Question</th>
                                        <th>Options</th>
                                        <th>Correct</th>
                                        <th>Subject</th>
                                        <th>Chapter / Topic</th>
                                    </tr>
                                </thead>
                                <tbody id="question-paper-import-preview-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button id="question-paper-preview-import-btn" type="button" class="btn btn-outline-success">
                        <i class="bi bi-eye me-1"></i>Preview
                    </button>
                    <button id="question-paper-confirm-import-btn" type="button" class="btn" style="background:#16a085;color:white;border:none" disabled>
                        <i class="bi bi-check2-circle me-1"></i>Create Question Paper
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="utils.js?v=2026.09.22.1"></script>
    <script src="question-papers.js?v=2026.09.22.1"></script>
    <script src="version.js?v=2026.09.22.1"></script>
</body>
</html>
