<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Student Results</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5HCH2EN3HZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5HCH2EN3HZ');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css?v=2026.09.22.1">
</head>
<body style="background:#f8f9fa">
    <div class="report-page test-results-page">
        <div class="card shadow-sm mb-4 no-print">
            <div class="card-body d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                <div>
                    <h4 class="mb-1"><i class="bi bi-people me-2"></i>Student Results</h4>
                    <p id="test-results-subtitle" class="text-muted mb-0">Loading test access...</p>
                </div>
                <div class="d-flex flex-column flex-sm-row gap-2">
                    <select id="test-select" class="hidden form-select form-select-sm" style="min-width: 220px;">
                        <option value="">Loading tests...</option>
                    </select>
                    <select id="sort-select" class="form-select form-select-sm" style="min-width: 180px;">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="score-asc">Score (Low-High)</option>
                        <option value="score-desc" selected>Score (High-Low)</option>
                    </select>
                    <select id="subject-select" class="form-select form-select-sm d-none" style="min-width: 180px;">
                        <option value="">All Subjects</option>
                    </select>
                    <div id="results-view-toggle" class="btn-group btn-group-sm" role="group" aria-label="Results view">
                        <button type="button" class="btn btn-outline-secondary active" data-results-view="table" title="Table view">
                            <i class="bi bi-table"></i> Table
                        </button>
                        <button type="button" class="btn btn-outline-secondary" data-results-view="cards" title="Card view">
                            <i class="bi bi-card-list"></i> Cards
                        </button>
                    </div>
                    <a href="index.html" class="btn" style="background:#2c3e50;color:white;border:none">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                    <button onclick="window.print()" class="hidden btn" style="background:#16a085;color:white;border:none">
                        <i class="bi bi-printer me-1"></i> Print
                    </button>
                </div>
            </div>
            <div id="table-score-controls" class="border-top px-3 py-3 d-none">
                <div class="row g-2 align-items-end">
                    <div class="col-4 col-md-2">
                        <label class="form-label small text-muted mb-1" for="scoreCorrect">Correct</label>
                        <input class="form-control form-control-sm" id="scoreCorrect" type="number" step="0.5" value="3">
                    </div>
                    <div class="col-4 col-md-2">
                        <label class="form-label small text-muted mb-1" for="scoreWrong">Wrong</label>
                        <input class="form-control form-control-sm" id="scoreWrong" type="number" step="0.5" value="-1">
                    </div>
                    <div class="col-4 col-md-2">
                        <label class="form-label small text-muted mb-1" for="scoreSkipped">Skipped</label>
                        <input class="form-control form-control-sm" id="scoreSkipped" type="number" step="0.5" value="0">
                    </div>
                    <div class="col-md-6">
                        <div class="small text-muted">Table marks, rank, grade, and GPA recalculate using these values.</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="test-results-content">
            <div class="text-center py-5">
                <div class="spinner-border" style="color:#2c3e50"></div>
                <p class="mt-2">Loading student results...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="utils.js?v=2026.09.22.1"></script>
    <script src="test-results.js?v=2026.09.22.1"></script>
    <script src="version.js?v=2026.09.22.1"></script>
</body>
</html>
