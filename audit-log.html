<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Edit Audit Log</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5HCH2EN3HZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5HCH2EN3HZ');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css?v=2026.09.22.1">
</head>
<body style="background:#f8f9fa">
    <div class="report-page audit-log-page">
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                <div>
                    <h4 class="mb-1"><i class="bi bi-clock-history me-2"></i>Result Edit Audit Log</h4>
                    <p id="audit-subtitle" class="text-muted mb-0">Loading history...</p>
                </div>
                <div class="d-flex flex-column flex-sm-row gap-2">
                    <button id="audit-refresh" type="button" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                    </button>
                    <a href="index.html" class="btn" style="background:#2c3e50;color:white;border:none">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                </div>
            </div>
            <div class="border-top px-3 py-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label for="audit-search" class="form-label small text-muted mb-1">Search</label>
                        <input id="audit-search" class="form-control form-control-sm" type="search" placeholder="Teacher, student, test, question...">
                    </div>
                    <div class="col-md-2">
                        <label for="audit-action-filter" class="form-label small text-muted mb-1">Action</label>
                        <select id="audit-action-filter" class="form-select form-select-sm">
                            <option value="">All actions</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="audit-section-filter" class="form-label small text-muted mb-1">Section</label>
                        <select id="audit-section-filter" class="form-select form-select-sm">
                            <option value="">All sections</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="audit-test-filter" class="form-label small text-muted mb-1">Test</label>
                        <select id="audit-test-filter" class="form-select form-select-sm">
                            <option value="">All tests</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="audit-page-size" class="form-label small text-muted mb-1">Rows</label>
                        <select id="audit-page-size" class="form-select form-select-sm">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="audit-content">
            <div class="text-center py-5">
                <div class="spinner-border" style="color:#2c3e50"></div>
                <p class="mt-2">Loading audit history...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="utils.js?v=2026.09.22.1"></script>
    <script src="audit-log.js?v=2026.09.22.1"></script>
    <script src="version.js?v=2026.09.22.1"></script>
</body>
</html>
